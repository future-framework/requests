# AWS experiment: one spot machine per job, no fan-out. psf/requests's run-tests.yml: build (python-version 3.14, os ubuntu), for the Superaction scoreboard.
name: Superaction (AWS)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: test / superaction-aws
    runs-on: superaction-aws
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"
        cache: 'pip'
        allow-prereleases: true
    - name: Install dependencies
      run: |
        make
    - name: Run tests
      run: |
        make ci
